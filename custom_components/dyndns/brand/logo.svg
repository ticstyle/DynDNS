<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlowLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B24" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanAccentLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F7FA" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGlowLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#03A9F4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1000" height="320" rx="32" fill="url(#bgGlowLogo)" />
  <rect width="992" height="312" x="4" y="4" rx="28" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.12" />

  <!-- LOGO ICON MARK (Scaled & Positioned Left) -->
  <g transform="translate(60, 40)">
    <!-- Globe Grid -->
    <g stroke="#03A9F4" stroke-opacity="0.25" stroke-width="3" fill="none">
      <circle cx="120" cy="120" r="90" />
      <ellipse cx="120" cy="120" rx="90" ry="35" />
      <line x1="120" y1="30" x2="120" y2="210" />
      <line x1="30" y1="120" x2="210" y2="120" />
    </g>

    <!-- Sync Ring -->
    <path d="M 120,20 A 100,100 0 1,1 25,90" fill="none" stroke="url(#ringGlowLogo)" stroke-width="12" stroke-linecap="round" />

    <!-- Arrowheads -->
    <path d="M 120,0 L 120,40 L 152,20 Z" fill="url(#cyanAccentLogo)" />
    <path d="M 38,70 L 12,100 L 0,62 Z" fill="url(#cyanAccentLogo)" />

    <!-- Center Node -->
    <circle cx="120" cy="120" r="20" fill="#0A0F14" stroke="#00E5FF" stroke-width="4" />
    <circle cx="120" cy="120" r="9" fill="url(#cyanAccentLogo)" />

    <!-- Connection Nodes -->
    <circle cx="58" cy="87" r="5" fill="#00E5FF" />
    <circle cx="182" cy="153" r="5" fill="#00E5FF" />
  </g>

  <!-- TYPOGRAPHY -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- DynDNS Brand Name -->
    <text x="340" y="165" font-size="108" font-weight="800" fill="url(#textGradient)" letter-spacing="2">
      Dyn<tspan fill="url(#cyanAccentLogo)">DNS</tspan>
    </text>

    <!-- Subtitle / Protocol Tag -->
    <text x="346" y="215" font-size="24" font-weight="500" fill="#81D4FA" letter-spacing="4" opacity="0.85">
      HOME ASSISTANT INTEGRATION
    </text>

    <!-- Protocol Pill Badge -->
    <g transform="translate(346, 235)">
      <rect width="130" height="28" rx="14" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="65" y="19" font-size="13" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="1">
        DynDNS2
      </text>
    </g>

    <g transform="translate(490, 235)">
      <rect width="178" height="28" rx="14" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="90" y="19" font-size="13" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="1">
        Custom HTTP GET
      </text>
    </g>
  </g>
</svg>
